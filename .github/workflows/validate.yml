name: Validate lab artifacts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test control and privacy checks
        run: python -m pytest -q
      - name: Check public artifacts
        run: python scripts/check_public_files.py
      - name: Compile Bicep
        run: |
          az bicep install
          for template in infra/*.bicep; do
            az bicep build --file "$template" --outfile "$RUNNER_TEMP/$(basename "$template").json"
          done
      - name: Scan full Git history
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --remote-name "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --remote-name "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --log-opts="--all" --redact --exit-code=1
